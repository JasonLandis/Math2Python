<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>Math 2 Python</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') ?? 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }

      // iOS zooms in when focusing text below 16px. maximum-scale stops that, and iOS still allows
      // pinch zoom. Not applied elsewhere because Android would block pinch zoom.
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      if (isIOS) {
        document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1'
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWYG5KPKVE"></script>

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JWYG5KPKVE');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
